name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Run linter
        run: bunx eslint .
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Check formatting
        run: bunx prettier --check .
  typecheck:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Check types
        run: bunx tsc --noEmit
  typecheck-frontend:
    name: Check frontend types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Check frontend types
        working-directory: frontend
        run: bunx tsc --noEmit
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Run tests
        working-directory: backend
        run: bun run test
  db-validate:
    name: Validate DB schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Validate DB schema
        working-directory: backend
        run: bun db:validate
  check-migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Validate migrations
        working-directory: backend
        run: bun run db:check-migrations
  validate-schemas:
    name: Validate schema naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Validate schema naming
        working-directory: backend
        run: bun run validate:schemas
  validate-db-usage:
    name: Validate db client usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Validate db client usage
        working-directory: backend
        run: bun run validate:db-usage
  validate-test-only:
    name: Check for .only() in tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install dependencies
        run: bun install
      - name: Check for .only() markers
        working-directory: backend
        run: bun run validate:test-only
