services:
  postgres:
    image: postgres:16-alpine
    container_name: blueprint-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blueprint_local_user
      POSTGRES_PASSWORD: blueprint_local_password
      POSTGRES_DB: blueprint_local_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U blueprint_local_user -d blueprint_local_db",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
