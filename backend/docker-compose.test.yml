services:
  postgres-test:
    image: postgres:16-alpine
    container_name: blueprint-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: blueprint_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d blueprint_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
